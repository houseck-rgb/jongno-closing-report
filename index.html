<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>마감 사진 올리기</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #ffffff; color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    padding-bottom: 100px;
  }
  header {
    padding: 24px 20px 16px; border-bottom: 1px solid #eee; position: sticky; top: 0; background: #fff; z-index: 10;
  }
  header h1 { font-size: 22px; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.5px; }
  header p { margin: 0; color: #888; font-size: 14px; }

  .store-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .store-btn {
    flex: 1 1 auto; min-width: 60px; padding: 10px 0; text-align: center;
    border: 1.5px solid #ddd; border-radius: 10px; font-size: 15px; font-weight: 600;
    color: #555; background: #fafafa;
  }
  .store-btn.active { border-color: #111; background: #111; color: #fff; }

  .progress-wrap { padding: 16px 20px 0; }
  .progress-bar { height: 8px; background: #f0f0f0; border-radius: 6px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: #111; transition: width .25s ease; }
  .progress-text { margin-top: 8px; font-size: 14px; color: #666; font-weight: 600; }

  .steps { padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }

  .step-card {
    border: 1.5px solid #eee; border-radius: 18px; padding: 18px; position: relative;
  }
  .step-card.done { border-color: #111; }

  .step-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .step-num {
    width: 30px; height: 30px; border-radius: 50%; background: #f0f0f0; color: #555;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex-shrink: 0;
  }
  .step-card.done .step-num { background: #111; color: #fff; }
  .step-title { font-size: 17px; font-weight: 800; flex: 1; }
  .step-badge { font-size: 12px; font-weight: 700; color: #bbb; }
  .step-card.done .step-badge { color: #111; }

  .photo-row { display: flex; gap: 10px; }
  .photo-box { flex: 1; }
  .photo-label { font-size: 12px; color: #999; margin-bottom: 6px; font-weight: 600; }
  .photo-frame { width: 100%; aspect-ratio: 3/4; border-radius: 12px; overflow: hidden;
    background: #f5f5f5; display: flex; align-items: center; justify-content: center;
    position: relative; border: 1px solid #eee; }
  .photo-frame.landscape { aspect-ratio: 3/2; }
  .photo-frame img { width: 100%; height: 100%; object-fit: contain; display: block; background: #f5f5f5; }

  .capture-frame { cursor: pointer; border: 1.5px dashed #ccc; background: #fafafa; }
  .capture-frame .plus { font-size: 34px; }
  .capture-frame .cap-hint { font-size: 12px; color: #aaa; margin-top: 4px; }
  .capture-frame.filled { border-style: solid; border-color: #111; }
  .retake {
    position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,.6); color: #fff;
    font-size: 11px; padding: 4px 8px; border-radius: 8px; font-weight: 600;
  }

  input[type=file] { display: none; }

  .footer {
    position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
    border-top: 1px solid #eee; padding: 12px 20px calc(14px + env(safe-area-inset-bottom));
  }
  .share-btn {
    width: 100%; padding: 16px 0; border: none; border-radius: 14px;
    background: #ccc; color: #fff; font-size: 17px; font-weight: 800;
  }
  .share-btn.ready { background: #111; }
  .footer-note { text-align: center; font-size: 12px; color: #aaa; margin-top: 8px; }

  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: #111; color: #fff; padding: 10px 18px; border-radius: 20px;
    font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 100;
  }
  .toast.show { opacity: 1; }

  .done-screen {
    position: fixed; inset: 0; background: #fff; z-index: 50; display: none;
    flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center;
  }
  .done-screen.show { display: flex; }
  .done-check {
    width: 70px; height: 70px; border-radius: 50%; background: #111; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 34px; margin-bottom: 18px;
  }
  .done-screen h2 { font-size: 20px; margin: 0 0 6px; }
  .done-screen p { color: #888; font-size: 14px; margin: 0 0 26px; }
  .done-close {
    padding: 13px 30px; border: 1.5px solid #ddd; border-radius: 12px; background: #fff; font-weight: 700; font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <h1>마감 사진 올리기</h1>
  <p id="dateLine">-</p>
</header>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText">0 / 5 완료</div>
</div>

<div class="steps" id="steps"></div>

<div class="footer">
  <button class="share-btn" id="shareBtn">전체 완료 후 공유하기</button>
  <div class="footer-note">사진은 자동으로 초경량 압축된 뒤 전송됩니다</div>
</div>

<div class="toast" id="toast"></div>

<div class="done-screen" id="doneScreen">
  <div class="done-check">✓</div>
  <h2>마감 사진 공유 완료</h2>
  <p id="doneTime">-</p>
  <button class="done-close" onclick="location.reload()">처음으로</button>
</div>

let selectedStore = STORES[0];
const captured = {}; // id -> {dataUrl, blob}

function fmtDate(d){
  const days = ["일","월","화","수","목","금","토"];
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${days[d.getDay()]}) 마감 보고`;
}
document.getElementById('dateLine').textContent = STORES[0] + ' · ' + fmtDate(new Date());

// 스텝 카드 렌더링
const stepsEl = document.getElementById('steps');
STEPS.forEach(step=>{
  const card = document.createElement('div');
  card.className = 'step-card';
  card.id = 'card-' + step.id;
  card.innerHTML = `
    <div class="step-head">
      <div class="step-num">${step.id}</div>
      <div class="step-title">${step.title}</div>
      <div class="step-badge" id="badge-${step.id}">미완료</div>
    </div>
    <div class="photo-row">
      <div class="photo-box">
        <div class="photo-label">기준 예시 사진</div>
        <div class="photo-frame${step.landscape ? ' landscape' : ''}"><img src="${step.ref}" loading="lazy"></div>
      </div>
      <div class="photo-box">
        <div class="photo-label">내가 찍은 사진</div>
        <div class="photo-frame capture-frame" id="frame-${step.id}" onclick="document.getElementById('input-${step.id}').click()">
          <div style="text-align:center">
            <div class="plus">📷</div>
            <div class="cap-hint">촬영하기</div>
          </div>
        </div>
        <input type="file" id="input-${step.id}" accept="image/*" capture="environment">
      </div>
    </div>
  `;
  stepsEl.appendChild(card);

  document.getElementById(`input-${step.id}`).addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    compressImage(file, 1280, 0.72).then(({dataUrl, blob})=>{
      captured[step.id] = { dataUrl, blob };
      renderCaptured(step.id, dataUrl);
      updateProgress();
      showToast(step.title + " 등록됨");
    });
  });
});

// 캔버스로 사진 리사이즈+압축 (저사양/저속 데이터 대응)
function compressImage(file, maxDim, quality){
  return new Promise((resolve)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e)=>{
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if (w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if (h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        canvas.toBlob((blob)=>{
          resolve({ dataUrl, blob });
        }, 'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderCaptured(id, dataUrl){
  const frame = document.getElementById('frame-' + id);
  frame.classList.add('filled');
  frame.innerHTML = `<img src="${dataUrl}"><div class="retake">다시 찍기</div>`;
  document.getElementById('card-' + id).classList.add('done');
  document.getElementById('badge-' + id).textContent = '완료';
}

function updateProgress(){
  const total = STEPS.length;
  const done = Object.keys(captured).length;
  document.getElementById('progressFill').style.width = (done/total*100) + '%';
  document.getElementById('progressText').textContent = `${done} / ${total} 완료`;
  const btn = document.getElementById('shareBtn');
  if (done === total){
    btn.classList.add('ready');
    btn.textContent = '마감 사진 공유하기';
  } else {
    btn.classList.remove('ready');
    btn.textContent = `전체 완료 후 공유하기 (${done}/${total})`;
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1400);
}

document.getElementById('shareBtn').addEventListener('click', async ()=>{
  if (Object.keys(captured).length < STEPS.length){
    showToast('아직 촬영하지 않은 항목이 있어요');
    return;
  }

  const now = new Date();
  const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  const summary = `[마감 사진 보고]\n${selectedStore}\n${timeStr}\n` + STEPS.map(s=>`${s.id}. ${s.title} - 완료`).join('\n');

  const files = STEPS.map(s=>{
    return new File([captured[s.id].blob], `${s.id}_${s.title}.jpg`, { type: 'image/jpeg' });
  });

  try{
    if (navigator.canShare && navigator.canShare({ files })){
      await navigator.share({
        title: `${selectedStore} 마감 사진`,
        text: summary,
        files
      });
    } else if (navigator.share){
      await navigator.share({ title: `${selectedStore} 마감 사진`, text: summary });
    } else {
      // 공유 미지원 환경 대비: 텍스트 복사
      await navigator.clipboard.writeText(summary);
      showToast('공유 미지원 기기 - 요약 텍스트가 복사되었습니다');
    }
    document.getElementById('doneTime').textContent = `${selectedStore} · ${timeStr}`;
    document.getElementById('doneScreen').classList.add('show');
  } catch(err){
    if (err.name !== 'AbortError'){
      showToast('공유 중 문제가 발생했습니다. 다시 시도해주세요');
    }
  }
});

updateProgress();
</script>
</body>
</html>
